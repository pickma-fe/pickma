# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'

reviews:
  profile: 'assertive'
  request_changes_workflow: true # 지적사항이 있으면 CHANGES_REQUESTED 상태로 제출
  collapse_walkthrough: false

  # 불필요한 부가 기능 비활성화
  high_level_summary: false # PR description 자동 수정 금지
  poem: false # 시(poem) 생성 금지

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - '!dist/**'
    - '!build/**'
    - '!out/**'
    - '!.next/**'
    - '!coverage/**'
    - '!storybook-static/**'
    - '!node_modules/**'
    - '!*.lock'
    - '!package-lock.json'
    - '!design/**'
    - '!.vscode/**'
    - '!temp/**'
    - '!AGENTS.override.md'
    - '!CLAUDE.local.md'
    - '!.claude/settings.local.json'

  path_instructions:
    - path: 'AGENTS.md'
      instructions: |
        ## Agent harness 검토 기준
        - 공유 지침에는 팀 공통 규칙만 두고, 로컬 전용 명령 금지는 AGENTS.override.md, CLAUDE.local.md, .claude/settings.local.json 같은 ignored 파일로 분리하는가.
        - AGENTS.md와 CLAUDE.md는 간결한 entry point로 유지하고, 세부 규칙은 .codex/instructions 또는 .claude/rules로 분리하는가.
        - Codex와 Claude의 문서 포맷 차이를 존중하는가. Codex 스킬은 .agents/skills, Claude 스킬은 .claude/skills에 둔다.
        - review-plan, team-pr-review는 Codex 전용 스킬로 유지하는가.
        - task 기반 임시 산출물은 temp/Txx-plan.md, temp/Txx-code-review.md, temp/Txx-checkpoint.md처럼 task ID를 파일명 맨 앞에 두는가.
        - update-phase 같은 phase 중심 workflow를 되살리지 않았는가.

    - path: 'CLAUDE.md'
      instructions: |
        ## Claude harness 검토 기준
        - CLAUDE.md는 Claude entry point로 간결하게 유지하고, 공유 지침은 AGENTS.md를 import하는가.
        - Claude 전용 로컬 규칙은 CLAUDE.local.md 또는 .claude/settings.local.json 같은 ignored 파일에 두는가.

    - path: '.codex/**'
      instructions: |
        ## Codex harness 검토 기준
        - .codex/instructions는 Codex용 세부 지침으로 유지하고, Claude 전용 규칙을 섞지 않는가.
        - 로컬 전용 명령 금지를 공유 지침에 넣지 않는가.

    - path: '.agents/**'
      instructions: |
        ## Codex skill 검토 기준
        - .agents/skills는 Codex 스킬로 유지하는가.
        - review-plan, team-pr-review는 Codex 전용 스킬로 유지하는가.
        - task 기반 임시 산출물은 temp/Txx-plan.md, temp/Txx-code-review.md, temp/Txx-checkpoint.md처럼 task ID를 파일명 맨 앞에 두는가.
        - update-phase 같은 phase 중심 workflow를 되살리지 않았는가.

    - path: '.claude/**'
      instructions: |
        ## Claude harness 검토 기준
        - .claude/rules는 path-scoped rule, .claude/skills는 Claude 전용 skill로 분리하는가.
        - review-plan, team-pr-review를 Claude 스킬로 추가하지 않는가.
        - task 기반 임시 산출물은 temp/Txx-plan.md, temp/Txx-code-review.md, temp/Txx-checkpoint.md처럼 task ID를 파일명 맨 앞에 두는가.
        - update-phase 같은 phase 중심 workflow를 되살리지 않았는가.

    - path: 'docs/tasks/**'
      instructions: |
        ## Task 문서 검토 기준
        - docs/tasks/README.md는 사용 원칙, 우선순위, ID 순 task table, 큰 단위 추천 진행 흐름만 담는가.
        - 개별 task 파일은 영구 Task ID를 유지하고 상태와 GitHub Issue 필드를 포함하는가.
        - 상태 값은 진행 전, 진행 중, 완료, 변경됨 중 하나인가.
        - GitHub Issue에는 issue 번호만 기록하고, 없으면 확인 필요로 두는가.
        - temp/를 공유 task 원본처럼 참조하지 않는가.

    - path: '.github/ISSUE_TEMPLATE/**'
      instructions: |
        ## Issue template 검토 기준
        - 기존 template 구조를 유지하는가.
        - task 연동을 위해 Task ID: 항목을 포함하는가.

    - path: '.github/pull_request_template.md'
      instructions: |
        ## PR template 검토 기준
        - 기존 template 구조를 유지하면서 Task ID: 항목을 포함하는가.
        - 관련 docs 최신화 필요 여부와 docs/tasks 상태/GitHub Issue 번호 갱신 여부를 확인하게 하는가.

    - path: 'docs/**'
      instructions: |
        ## 설계 문서 검토 기준
        - 현재 기준 문서는 docs/system_architecture.md, docs/type_architecture.md, docs/domain.md, docs/api_spec.md 이다.
        - docs/type_architecture.md는 Domain/Contract/Mapper 가이드, docs/domain.md는 실제 Domain Type 명세이다.
        - API/Domain/DB 상태값이 1:1 대응이라고 가정하지 않는가.
        - API contract DTO는 JSON-safe, camelCase, ISO string 날짜 정책을 따르는가.
        - Supabase DB 접근은 src/api -> /api/* Route Handler -> Supabase 경유로 설명되는가.
        - Auth는 Supabase SDK 래퍼, 세션은 @supabase/ssr 기반 cookie session, proxy는 세션 refresh/보호 라우트 역할로 설명되는가.
        - Mock 환경 변수는 API_MOCK_ENABLED를 사용하는가.

    - path: 'supabase/migrations/**'
      instructions: |
        ## Migration 검토 기준
        - 스키마 변경은 `docs/migration_policy.md` 기준의 incremental migration으로 작성하는가.
        - 원격 적용 이후의 초기 migration 직접 수정은 `docs/migration_policy.md`의 예외 조건에 해당하는가.
        - migration 파일명은 `YYYYMMDDHHMMSS_<snake_case_name>.sql` 형식인가.
        - migration은 단일 주제 변경을 담고, 필요한 경우 `IF NOT EXISTS` 등 idempotent guard를 포함하는가.

    - path: 'src/types/**'
      instructions: |
        ## Domain 타입 검토 기준
        - any 타입 사용 절대 금지
        - 앱 내부 Domain 타입만 정의하는가
        - HTTP API request/response DTO가 섞이지 않았는가 (DTO는 src/contracts)
        - Domain 날짜는 필요 시 Date로 표현하고, contract DTO와 구분되는가
        - DB/API/Domain 상태값이 1:1 대응이라고 강제하지 않는가
        - 계산 필드(isSoldOut, isExpired, availableStock 등)가 Domain 의도와 맞는가
        - src/types/supabase.ts는 Supabase CLI generated file로 취급되고 직접 수정되지 않는가

    - path: 'src/contracts/**'
      instructions: |
        ## API Contract DTO 검토 기준
        - any 타입 사용 절대 금지
        - request/response DTO와 공통 API contract만 정의하는가
        - 필드명은 camelCase인가
        - 날짜는 ISO string인가
        - response envelope, pagination, validation issue 타입이 docs/api_spec.md와 일치하는가
        - Domain Date 객체나 UI 전용 타입이 섞이지 않았는가

    - path: 'src/lib/**'
      instructions: |
        ## 유틸리티 검토 기준
        - any 타입 사용 절대 금지
        - src/lib에는 framework/backend와 분리 가능한 domain/shared library만 두는가.
        - Domain 로직이 contracts DTO를 직접 import하지 않는가.
        - Route Handler 전용 backend helper는 src/app/api/_lib 또는 src/app/api/{resource}/_lib 아래에 두는가.
        - 순수 함수 지향 (사이드 이펙트 최소화)
        - 공통 AppError/error code/message가 docs/api_spec.md의 에러 정책과 일치하는가

    - path: 'src/mocks/**'
      instructions: |
        ## Mock fixture 검토 기준
        - mock fixture는 contract DTO 기준으로 작성하는가.
        - mocks 내부 파일과 src/contracts 외 layer를 import하지 않는가.
        - production UI/component가 src/mocks를 직접 import하도록 유도하지 않는가.
        - public mock 이미지 경로가 실제 public/images/mock 하위 파일과 일치하는가.

    - path: 'src/api/**'
      instructions: |
        ## 클라이언트 API 레이어 검토 기준
        - apiClient는 공통 envelope을 파싱하고 성공 시 data만 반환하는가
        - cookie 기반 세션을 사용하므로 Authorization Bearer를 임의로 주입하지 않는가
        - fetch에는 credentials: 'include'가 적용되는가
        - 도메인 API 객체명은 단수형(productApi, orderApi 등)인가
        - 공개/소비자 API, seller API, admin API가 역할별 폴더로 분리되어 있는가
        - client mapper가 contract DTO를 Domain 타입으로 변환하는가
        - ISO string 날짜를 Domain Date로 변환하는가
        - 컴포넌트에서 Supabase Auth SDK를 직접 호출하지 않고 authApi 래퍼를 사용하는가

    - path: 'src/stores/**'
      instructions: |
        ## Zustand 스토어 검토 기준
        - any 타입 사용 절대 금지
        - Zustand는 client/UI 상태에 사용하고 서버 상태 캐싱에 사용하지 않는가
        - 서버 데이터 조회/변경은 TanStack Query hook과 src/api를 사용하는가
        - 액션 네이밍은 일관적인가
        - 파생 상태(derived state)는 selector로 분리하고 있는가
        - store → components 역방향 import가 없는가 (스토어가 컴포넌트를 알면 안 됨)
        - 불필요한 리렌더링을 유발할 수 있는 객체/배열 참조 변경이 있는가

    - path: 'src/hooks/**'
      instructions: |
        ## Hook 검토 기준
        - 서버 상태 hook은 TanStack Query를 사용하는가
        - queryKey는 [domain, scope, params/id] 형식과 복수형 domain명을 사용하는가
        - 하나의 hook은 하나의 파일에 있는가
        - hook은 src/api 도메인 메서드를 호출하고 fetch URL/DTO 세부사항을 컴포넌트에 노출하지 않는가
        - mutation 성공 후 관련 query invalidate가 적절한가

    - path: 'src/hooks/seller/applications/**'
      instructions: |
        ## 판매자 신청 hook 검토 기준
        - 판매자 신청 문서 업로드 후 도메인 API 실패 시 업로드 성공 파일의 storagePath 목록으로 cleanup API를 best-effort 호출하는가.
        - cleanup 실패가 원래 mutation 에러를 가리거나 사용자 흐름을 추가로 깨뜨리지 않는가.

    - path: 'src/components/**'
      instructions: |
        ## 컴포넌트 검토 기준
        - any 타입 사용 절대 금지
        - 컴포넌트당 하나의 파일 원칙 (하나의 파일에 여러 컴포넌트 export 금지)
        - 인라인 스타일(style={{...}}) 금지 — Tailwind CSS 유틸리티 클래스만 사용
        - UI 컴포넌트는 Headless UI 사용
        - Headless UI 컴포넌트(Dialog, Listbox, Combobox 등)에 Tailwind로 스타일 직접 적용하는가
        - Props 인터페이스는 파일 상단에 정의
        - React 이벤트 핸들러는 handle 접두사 (handleClick, handleSubmit 등)
        - 접근성: 인터랙티브 요소에 적절한 role, aria 속성이 있는가
        - 역할별 컴포넌트 격리: consumer/, seller/, admin/ 컴포넌트가 서로 직접 import 금지

    - path: 'src/app/(consumer)/**'
      instructions: |
        ## 소비자 페이지 검토 기준
        - 퍼블릭 페이지 (/, /search, /products/[id]): 비로그인 접근 가능한가
        - 보호 페이지 (/order/[productId], /payment, /mypage/**): 미로그인 시 공개 진입점에 auth=required, next query를 붙여 리다이렉트하는가
        - 상품 목록: 마감 시간(end_time)이 지난 상품이 노출되지 않는가
        - 재고(stock) 0 이하인 상품에 예약 요청을 보낼 수 없는가
        - 결제 플로우 순서: 주문 생성 → POST /api/payments/prepare (provider, orderNumber) → provider redirectUrl → POST /api/payments/confirm → 주문 확정

    - path: 'src/app/(seller)/**'
      instructions: |
        ## 판매자 페이지 검토 기준
        - 미로그인/미승인 판매자가 /seller/dashboard, /seller/products, /seller/orders, /seller/store에 접근 불가한가
        - 승인 대기(pending) 사용자는 /seller/pending으로만 리다이렉트되는가
        - 상품 CRUD: 본인 가게(store_id) 상품만 수정/삭제 가능한가
        - 픽업 완료·노쇼 처리: 본인 가게 주문만 처리 가능한가
        - 예약이 존재하는 상품(reserved/ready 주문이 있는 경우) 삭제 시도 시 거부하는가

    - path: 'src/app/(admin)/**'
      instructions: |
        ## 관리자 페이지 검토 기준
        - role이 admin이 아닌 사용자의 접근을 차단하는가
        - 가게 승인 처리 시 해당 users 레코드의 role을 seller로 변경하는가
        - 가게 거절 시 reject_reason 필드가 저장되는가
        - 사용자 정지/활성화 처리가 users.status 필드에만 영향을 주는가

    - path: 'src/app/api/**'
      instructions: |
        ## API Route 검토 기준
        - any 타입 사용 절대 금지
        - route.ts는 HTTP 입출력, validation, auth helper, response envelope 생성을 담당하는가
        - 도메인 내부 보조 파일은 src/app/api/{resource}/_lib/{service,mapper,schemas}.ts에 두는가
        - service.ts는 HTTP 객체를 모르고 Supabase query와 비즈니스 로직을 담당하는가
        - mapper.ts는 Supabase row/join 결과를 contract DTO로 변환하는가
        - schemas.ts는 Zod로 request query/body를 검증하는가
        - 파일명 앞에 _를 붙이지 않고, Next.js private folder인 _lib/만 사용하는가
        - 공통 response envelope을 사용하고 HTTP status와 body statusCode가 일치하는가
        - AppError와 error code/message 정책을 사용하는가
        - Zod 검증 실패 details가 field-level path/message로 변환되는가
        - 보안: TOSS_SECRET_KEY, SUPABASE_SERVICE_ROLE_KEY 등 환경 변수 값을 응답 body에 절대 포함하지 않는가
        - 보안: 에러 응답에 스택 트레이스, 내부 경로 등 민감 정보 포함 금지
        - service role client 사용은 `docs/system_architecture.md`의 허용 케이스(RPC, 초기 row 생성, admin cross-user, Storage API)에 해당하는가
        - owner-scoped 단순 조회/수정에 service role을 새로 도입하지 않는가
        - auth helper가 리소스 scope에 맞는가: activeUser, seller, sellerStore, admin
        - service에 params/body id를 넘기기 전에 authUser.id 또는 store.id 기반 owner/store/admin scope를 검증하는가
        - service role 또는 owner-scoped route 변경 시 권한 실패/타 사용자 접근 차단 테스트가 함께 추가 또는 갱신되는가
        - 외부 API 호출 실패 시 적절한 HTTP 상태 코드로 응답하는가 (500 남발 금지)
        - 결제 API:
          - 주문 생성은 POST /api/orders, 결제 준비는 POST /api/payments/prepare, 결제 승인은 POST /api/payments/confirm 으로 분리되는가
          - 현재 결제 구조는 Toss Payments 직접 연결이며 PAYMENT_MOCK 환경변수로 mock/real 결제 흐름을 분기하는가
          - PickMa 내부 주문 식별자는 orderNumber이며, Toss 외부 필드명은 결제 API 내부에서만 다루는가
          - 클라이언트가 전달한 결제 금액을 DB의 주문 금액과 대조 검증하는가 (금액 위변조 방지)
          - 결제 완료 후 payment 저장, 주문 확정, 재고 확정 처리가 confirm_payment RPC로 원자적으로 처리되는가
          - 결제 confirm 흐름 변경 시 T01 보상 정책을 유지하는가: Toss confirm 성공 후 confirm_payment RPC 실패 시 PAYMENT_MOCK=false는 callTossCancel 후 revert_payment_processing, PAYMENT_MOCK=true는 revert_payment_processing만 시도하는가
          - API_MOCK_ENABLED는 데이터 레이어 mock 여부를 제어하며 PAYMENT_MOCK 결제 분기와 별개로 취급되는가
        - 주문 API (/api/orders):
          - 재고 부족 시 예약을 거부하는가
          - 주문 상태 전이가 docs/api_spec.md와 일치하는가
        - 상품 API (/api/products):
          - 상품 목록 필터/정렬은 DB query 단계에서 적용하고, 전체 조회 후 메모리 pagination을 되살리지 않는가
          - discountOption 필터와 discountRate 정렬은 products.discount_rate DB 컬럼을 사용하는가
          - originalPrice, availableStock, discountRate는 mapper에서 products.original_price, products.available_stock, products.discount_rate를 읽는가
        - Storage cleanup API:
          - `seller-application-documents` 같은 민감 bucket 삭제는 `docs/system_architecture.md`의 Storage lifecycle 정책을 따르는가
          - `DELETE /api/files`는 requireActiveUser() 인증 후 userId prefix 등으로 소유권을 검증하고, service role client로 storage 삭제를 수행하는가
          - Cron cleanup endpoint는 CRON_SECRET bearer 인증을 확인하고, 인증 실패 시 cleanup을 실행하지 않는가
        - Admin API는 /api/admin/*로 분리되고 requireAdmin()을 통과하는가

    - path: 'src/proxy.ts'
      instructions: |
        ## Proxy 권한 체크 검토 기준
        - @supabase/ssr 기반 Supabase cookie session refresh가 올바르게 처리되는가
        - config.matcher가 정적 asset을 제외한 앱 요청 전반에 적용되는가
        - matcher에서 _next/static, _next/image, favicon.ico, robots.txt, sitemap.xml, 이미지 asset 확장자를 제외하는가
        - 별도 /login, /seller/login 페이지를 전제로 구현하지 않는가
        - fetch에 Authorization 헤더를 주입하는 레이어로 오해하고 구현하지 않았는가
        - /order/**, /payment, /mypage/**, /seller/register, /seller/pending:
          로그인 여부 확인
        - /seller/dashboard/**, /seller/products/**, /seller/orders/**, /seller/store/**:
          로그인 여부 확인 → 가게 승인 여부(stores.status === 'approved') 확인
        - /admin/**:
          로그인 여부 확인 → users.role === 'admin' 확인
        - 미인증 요청은 공개 진입점에 auth=required, next query를 붙여 리다이렉트하고 클라이언트 로그인 모달 흐름과 연결되는가
        - 권한 부족 요청은 적절한 경로로 리다이렉트하는가
        - proxy에서 DB를 직접 조회할 때 서비스 역할 키가 클라이언트에 노출되지 않는가

