<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PickMa 비밀번호 재설정</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f9fafb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f9fafb; padding: 40px 0;">
      <tr>
        <td align="center">
          <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; padding: 40px 32px;">
            <tr>
              <td>
                <p style="margin: 0 0 4px 0; font-size: 13px; font-weight: 600; color: #7c3aed;">PickMa</p>
                <h1 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 700; color: #111827;">비밀번호 재설정</h1>
                <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #374151;">
                  비밀번호 재설정 요청이 접수되었습니다.<br />
                  아래 버튼을 눌러 새 비밀번호를 설정해 주세요.
                </p>
                <table cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                  <tr>
                    <td style="background-color: #7c3aed; border-radius: 6px;">
                      <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 12px 24px; font-size: 15px; font-weight: 600; color: #ffffff; text-decoration: none;">
                        비밀번호 재설정하기
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin: 0 0 8px 0; font-size: 13px; color: #6b7280;">
                  버튼이 작동하지 않으면 아래 링크를 복사해 브라우저에 붙여넣어 주세요.
                </p>
                <p style="margin: 0 0 24px 0; font-size: 12px; color: #9ca3af; word-break: break-all;">
                  {{ .ConfirmationURL }}
                </p>
                <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 0 0 24px 0;" />
                <p style="margin: 0; font-size: 13px; color: #9ca3af;">
                  이 링크는 발송 후 일정 시간이 지나면 만료됩니다. 요청하지 않으셨다면 이 이메일을 무시해 주세요.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
