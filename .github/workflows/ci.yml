name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_MOCK_ENABLED: 'true'
      PAYMENT_MOCK: 'true'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      SUPABASE_SECRET_KEY: test-secret-key
      NEXT_PUBLIC_TOSS_CLIENT_KEY: test_ck_ci
      TOSS_SECRET_KEY: test_sk_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_MOCK_ENABLED: 'false'
      PAYMENT_MOCK: 'true'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_TOSS_CLIENT_KEY: test_ck_e2e
      TOSS_SECRET_KEY: test_sk_e2e
      E2E_CONSUMER_EMAIL: customer1@pickma-seed.local
      E2E_CONSUMER_PASSWORD: pickma-e2e-password
      E2E_SELLER_EMAIL: seller1@pickma-seed.local
      E2E_SELLER_PASSWORD: pickma-e2e-password
      E2E_ADMIN_EMAIL: e2e-admin@pickma.local
      E2E_ADMIN_PASSWORD: pickma-e2e-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Supabase local stack and apply seed
        run: |
          npx supabase start
          npx supabase db reset --local --yes
          npx supabase db query --local --file supabase/seeds/e2e-auth.sql
          npx supabase db query --local --file supabase/seeds/e2e-data.sql

      - name: Export Supabase local env
        run: |
          npx supabase status -o env | while IFS='=' read -r key value; do
            case "$key" in
              API_URL)     echo "NEXT_PUBLIC_SUPABASE_URL=${value}"                  >> "$GITHUB_ENV" ;;
              ANON_KEY)    echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${value}"      >> "$GITHUB_ENV" ;;
              SERVICE_ROLE_KEY) echo "SUPABASE_SECRET_KEY=${value}"                 >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Run E2E tests
        run: npm run e2e -- --project=public --project=consumer --project=seller --project=admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Stop Supabase local stack
        if: always()
        run: npx supabase stop --no-backup
